name: Weekly Stock Report

on:
  schedule:
    # Every Saturday at 14:00 UTC (after US markets close Friday)
    - cron: '0 14 * * 6'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write  # needed to push scores.db back

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history for scores.db)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python report.py weekly > report_output.txt 2>&1

      - name: Send email
        if: env.SMTP_USER != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python report.py weekly --email

      - name: Commit updated scores.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.db
          git diff --cached --quiet || git commit -m "chore: update scores.db [skip ci]"
          git push

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: report_output.txt
          retention-days: 30
